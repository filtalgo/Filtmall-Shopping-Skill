interface:
  display_name: "筛电 Agent"
  short_description: "委托筛电 Agent 查商品；常驻服务直接返回界面卡片"
  default_prompt: "使用 $filtmall-shopping：优先直接运行 scripts/service.py --once，通过标准输入提交 conversation 和用户文本，等待终态并沿用对话标识。异常或展示失败使用 resume，勿重复提交写操作。不要编写包装器或调用内部客户端。支持内联 HTML 时原样展示本轮 fragment_file、cart_fragment_file、checkout_fragment_file 和 after_sale_fragment_file；正文读取 answer_file。其他宿主选择 html 或 md 并读取对应商品、购物车、结算和售后文件。无正文但有业务文件也是有效结果，缺少本轮产物不借旧文件补齐。支付准备和售后完成不代表付款或退款到账。"
